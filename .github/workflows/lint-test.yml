name: Lint and Test

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/lint-test.yml"
      - "ct.yaml"
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/lint-test.yml"
      - "ct.yaml"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml --target-branch ${{ github.event.repository.default_branch }}

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          set -euo pipefail
          for values in charts/grantsy/ci/*-values.yaml; do
            echo "::group::kubeconform $(basename "$values")"
            helm template grantsy charts/grantsy -f "$values" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      - name: Verify required-field validation fails as expected
        run: |
          set -e
          if helm template charts/grantsy --set ingress.api.enabled=true >/dev/null 2>&1; then
            echo "expected failure: ingress.api.enabled=true without host should fail" >&2
            exit 1
          fi
          if helm template charts/grantsy --set database.driver=postgres >/dev/null 2>&1; then
            echo "expected failure: database.driver=postgres without dsnSecret.name should fail" >&2
            exit 1
          fi
          if helm template charts/grantsy --set autoscaling.enabled=true >/dev/null 2>&1; then
            echo "expected failure: autoscaling+sqlite should fail" >&2
            exit 1
          fi
          echo "all required-field validations failed as expected"

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.10.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml --target-branch ${{ github.event.repository.default_branch }}
