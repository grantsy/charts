apiVersion: v1
kind: Pod
metadata:
  name: {{ include "grantsy.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grantsy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: healthz
      image: busybox:1.36
      command:
        - sh
        - -c
        - wget -q -O- "http://{{ include "grantsy.fullname" . }}:{{ .Values.service.port }}/healthz"
