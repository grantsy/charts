# Postgres scenario: HPA enabled, persistence off, DSN supplied via Secret through env.
replicaCount: 2
persistence:
  enabled: false
ingress:
  webhook:
    enabled: true
    host: hooks.example.test
  api:
    enabled: true
    host: api.example.test
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
podDisruptionBudget:
  enabled: true
  minAvailable: 1
serviceMonitor:
  enabled: true
env:
  - name: DATABASE_DSN
    valueFrom:
      secretKeyRef:
        name: grantsy-postgres
        key: dsn
config:
  env: prod
  database:
    driver: postgres
    namespace: grantsy
    dsn: "${DATABASE_DSN}"
  log:
    level: info
    format: json
  metrics:
    enable: true
    path: /metrics
