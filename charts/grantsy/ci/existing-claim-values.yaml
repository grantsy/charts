# Existing-resources scenario: operator brings their own PVC and Secrets.
# The chart reads these without forking. Inline `config:` is required since the chart no longer
# supports `existingConfigMap` — operators managing config externally should template this value
# through their GitOps tooling.
persistence:
  enabled: true
  existingClaim: my-grantsy-data
ingress:
  webhook:
    enabled: true
    host: hooks.example.test
  api:
    enabled: true
    host: api.example.test
    tls:
      enabled: true
      secretName: api-tls-cert
envFrom:
  - secretRef:
      name: my-existing-app-secrets
config:
  env: prod
  database:
    driver: sqlite
    namespace: grantsy
    dsn: /var/lib/grantsy/grantsy.db
